name: Windows package diagnostic

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Git ref to test
                required: true
                default: release/v0.12.3

permissions:
    contents: read

jobs:
    docs-arm64:
        runs-on: windows-11-arm
        timeout-minutes: 40
        defaults:
            run:
                shell: pwsh
        env:
            WLD_TEST_FILE_TIMEOUT_MS: "1800000"
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.ref }}
                  submodules: recursive
            - name: Install pinned native Bun
              run: |
                  $zip = Join-Path $env:RUNNER_TEMP 'bun.zip'
                  Invoke-WebRequest 'https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/bun-windows-aarch64.zip' -OutFile $zip
                  Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
                  $bin = Join-Path $env:RUNNER_TEMP 'bun-windows-aarch64'
                  $bin >> $env:GITHUB_PATH
                  & "$bin/bun.exe" -e 'if (process.arch !== "arm64" || process.versions.bun !== "1.4.3") throw new Error("Wrong native Bun runtime")'
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Install frozen dependencies
              run: bun run install:locked
            - name: Measure the docs workflow suite without changing the release limit
              run: bun scripts/run-tests.js scripts/docs-workflow.test.ts
            - uses: actions/upload-artifact@v5
              if: always()
              with:
                  name: docs-arm64-diagnostic
                  include-hidden-files: true
                  path: .ci-cache/
